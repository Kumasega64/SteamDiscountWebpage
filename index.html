<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title class="font-mono">Steam Discount</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#171A21] text-[#c6d4df] font-sans">

    <!-- HEADER / HERO -->
    <header class="w-full h-[100vh] relative overflow-hidden">
    <img
      src="asset/sale.jpg"
      alt="Steam Sale"
      class="absolute inset-0 w-full h-full object-fill"
    >
    <div class="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center">
        <h1 class="text-white text-4xl md:text-6xl font-bold">Steam Deals Await!</h1>
    </div>
</header>

    <!-- MAIN CONTENT -->
    <div class="max-w-xl mx-auto mt-6 bg-[#1B2838] rounded-lg shadow-xl p-8 space-y-6">

      <h2 class="text-2xl font-bold text-white text-center">Search Steam Deals</h2>

      <div class="grid grid-cols-1 gap-4">

        <div>
          <label for="lowest" class="block text-sm font-medium">Lowest Price</label>
          <input type="number" id="lowest" step="0.01"
            class="w-full mt-1 p-2 bg-[#273241] text-white placeholder-[#646c76] border border-[#3f4c65] rounded focus:outline-none focus:ring-2 focus:ring-[#66C0F4]" />
        </div>

        <div>
          <label for="highest" class="block text-sm font-medium">Highest Price</label>
          <input type="number" id="highest" step="0.01"
            class="w-full mt-1 p-2 bg-[#273241] text-white placeholder-[#646c76] border border-[#3f4c65] rounded focus:outline-none focus:ring-2 focus:ring-[#66C0F4]" />
        </div>

        <div>
          <label for="metacritic" class="block text-sm font-medium">Minimum Metacritic Score</label>
          <input type="number" id="metacritic" min="0" max="100"
            class="w-full mt-1 p-2 bg-[#273241] text-white placeholder-[#646c76] border border-[#3f4c65] rounded focus:outline-none focus:ring-2 focus:ring-[#66C0F4]" />
        </div>

        <div>
          <label for="minimumReviewCount" class="block text-sm font-medium">Minimum Review Count</label>
          <input type="number" id="minimumReviewCount"
            class="w-full mt-1 p-2 bg-[#273241] text-white placeholder-[#646c76] border border-[#3f4c65] rounded focus:outline-none focus:ring-2 focus:ring-[#66C0F4]" />
        </div>

        <button id="searchDeals"
          class="w-full py-2 bg-[#beee11] hover:bg-[#aacc0f] text-[#1B2838] font-semibold rounded shadow transition">
          Search Deals
        </button>

      </div>

      <h3 class="text-xl text-white border-b border-[#3f4c65] pb-2">Results:</h3>
      <div id="results" class="space-y-3"></div>
    </div>

    <!-- External JS -->
    <script src="gameAPI.js"></script>

</body>
</html>
